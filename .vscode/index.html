<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thomas J Samora</title>
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://kit.fontawesome.com/ba295a7eca.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <section id="about-me">
      <nav>
        <div class="personal__logo">Thomas J Samora</div>
        <ul class="nav__link--list">
          <li>
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Languages</a
            >
          </li>
          <li>
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Projects
            </a>
          </li>
          <li>
            <a href="" class="nav__link--anchor nav__link--anchor-primary"
              >Contact
            </a>
          </li>
        </ul>
      </nav>
      <div class="flex flex-1">
        <div class="about-me__info row">
          <div class="about-me__info--container">
            <figure class="about-me__picture--mask">
              <img
                src="./me.jpg"
                class="about-me__picture"
                alt="Profile Picture of me"
              />
            </figure>
            <h1 class="about-me__info--title">
              Hello! 👋 I'm <span class="text--green">Thomas J Samora </span>
            </h1>
            <p class="about-me__info--para">
              I'm a <strong class="text--green">software engineer</strong> with
              a passion for creating innovative and efficient solutions using
              web application that impact our world.
            </p>
            <div class="about-me__links">
              <a href="" class="about-me__link">
                <i class="fa-brands fa-square-linkedin"></i>
              </a>
              <a href="" class="about-me__link">
                <i class="fa-brands fa-square-github"></i>
              </a>
              <a href="" class="about-me__link">
                <i class="fa-solid fa-square-envelope"></i>
              </a>
              <a href="" class="about-me__link">
                <i class="fa-solid fa-code"></i>
              </a>
            </div>
          </div>
          <figure class="about-me__img--container">
            <img
              src="./undraw_software-engineer_ljie.svg"
              class="about-me__img"
              alt="undraw me img"
            />
          </figure>
        </div>
      </div>
    </section>
  </body>
</html>
